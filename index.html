<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#000000">
<title>Dungen Killer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="touch-layer"></div>
<div id="joy-base"></div>
<div id="joy-knob"></div>

<div id="hud">
  <div id="hp-wrap">
    <div id="hp-bar"><div id="hp-lag"></div><div id="hp-fill"></div></div>
    <div id="st-bar"><div id="st-fill"></div></div>
    <div id="mp-bar"><div id="mp-fill"></div></div>
    <div id="dash-pips"></div>
    <div id="run-info"></div>
  </div>
  <div id="clock">
    <div id="clock-phase"></div>
    <div id="clock-time"></div>
  </div>
  <div id="crosshair"></div>
  <div id="banner"><div id="banner-title"></div><div id="banner-sub"></div></div>
  <div id="prompt"></div>
  <div id="feed"></div>
  <div id="speech"></div>
  <canvas id="minimap" width="140" height="140"></canvas>
  <div id="boss-bar"><div class="bb-name"></div><div class="bb-track"><div class="bb-fill"></div></div></div>
  <div id="hints"></div>
  <div id="dmg-layer"></div>
  <div id="btn-hit" class="touch-only">HIT</div>
  <div id="btn-menu" class="touch-only">&#9776;</div>
  <div id="btn-bag" class="touch-only">&#9672;</div>
  <div id="btn-admin-hud" class="touch-only">ADM</div>
  <div id="btn-flask" class="touch-only">FLASK</div>
  <div id="btn-jump" class="touch-only">JUMP</div>
  <div id="btn-use" class="touch-only">USE</div>
  <div id="btn-roll" class="touch-only">DASH</div>
  <div id="btn-block" class="touch-only">BLOCK</div>
  <div id="btn-quick" class="touch-only">ITEM</div>
  <div id="btn-order" class="touch-only">ORD</div>
  <div id="skillbar">
    <div id="btn-sk1" class="sk" data-k="1"><span class="sk-ic"></span><span class="sk-cd"></span><span class="sk-key">1</span></div>
    <div id="btn-sk2" class="sk" data-k="2"><span class="sk-ic"></span><span class="sk-cd"></span><span class="sk-key">2</span></div>
    <div id="btn-sk3" class="sk" data-k="3"><span class="sk-ic"></span><span class="sk-cd"></span><span class="sk-key">3</span></div>
    <div id="btn-sk4" class="sk" data-k="4"><span class="sk-ic"></span><span class="sk-cd"></span><span class="sk-key">4</span></div>
  </div>
  <div id="conquest-ctr"></div>
  <div id="pit-hud"></div>
  <div id="sprint-ind"></div>
</div>

<div id="death"><div class="death-text">YOU DIED</div><div class="death-sub"></div></div>

<div id="title">
  <div class="title-inner">
    <div class="title-name">DUNGEN KILLER</div>
    <div class="title-sub">Emberwick holds one hour. Feed the fire.</div>
    <div class="title-start" id="title-start">Click to begin</div>
    <div class="title-note" id="title-note"></div>
  </div>
</div>

<div id="menu" class="hidden">
  <div class="menu-panel">
    <div class="menu-tabs">
      <button class="tab focusable" data-tab="settings">Settings</button>
    </div>
    <div class="menu-body">
      <section data-page="settings">
        <label class="row">Look sensitivity <span id="sens-val">1.0</span>
          <input id="opt-sens" class="focusable" type="range" min="0.2" max="3" step="0.1" value="1"></label>
        <label class="row check"><input id="opt-invert" class="focusable" type="checkbox"> Invert look Y</label>
        <label class="row check"><input id="opt-day" class="focusable" type="checkbox"> Always day in Emberwick <small>(a costly blessing of the Hearth-keepers)</small></label>
        <label class="row check"><input id="opt-minimap" class="focusable" type="checkbox"> Show minimap</label>
        <label class="row check"><input id="opt-bob" class="focusable" type="checkbox"> Head bob + strafe tilt</label>
        <label class="row">Graphics <select id="opt-gfx" class="focusable"><option value="low">Low (fast)</option><option value="med">Medium</option><option value="high">High</option></select></label>
        <div class="row buttons">
          <button id="btn-fullscreen" class="focusable">Fullscreen</button>
          <button id="btn-reset" class="focusable danger">Reset save</button>
        </div>
        <div class="row buttons">
          <button id="btn-admin" class="focusable admin">Admin / Debug menu</button>
        </div>
      </section>
    </div>
    <button id="btn-resume" class="focusable resume">Resume</button>
    <div class="menu-hint" id="menu-hint"></div>
  </div>
</div>

<div id="panel" class="hidden"></div>
<div id="bigmap" class="hidden"><canvas></canvas><div class="bm-hint">M / tap / R3 to close</div></div>

<div id="fade"></div>
<div id="error"></div>
<script type="module" src="js/main.js"></script>
</body>
</html>
